# 로컬 개발 전용 설정. docker compose up 하면 compose.yaml과 자동으로 합쳐진다.
# 포트는 내 컴퓨터(127.0.0.1)에만 열고, PostgreSQL은 로컬에 설치된 PostgreSQL(5432)과 겹치지 않게 5433을 쓴다.

services:
  postgres:
    container_name: trendizm-postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  redis:
    container_name: trendizm-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

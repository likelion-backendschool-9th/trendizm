# 테스트 전용 설정: H2 인메모리 DB를 PostgreSQL 호환 모드로 쓴다. 비밀값 없음.
spring.datasource.url=jdbc:h2:mem:trendizm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 테이블은 엔티티 기준으로 테스트마다 새로 만들고 끝나면 지운다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# data.sql(화면 확인용 초기 데이터)은 테스트에서 실행하지 않는다. 테스트 데이터는 각 테스트 클래스의 @BeforeEach에서 직접 저장한다.
spring.sql.init.mode=never

# JWT: 테스트 전용 값. 실제 비밀키가 아니다.
trendizm.jwt.secret=test-only-jwt-secret-not-for-real-use-0123456789

# 썸네일 파일 저장 폴더. 테스트는 저장소를 mock으로 바꾸거나 임시 폴더를 쓰지만, 혹시 저장되더라도 build 안에만 남게 한다.
trendizm.thumbnail.dir=build/test-thumbnails
# 문서를 만들면 커밋 뒤 출처에 접속해 썸네일을 받는데, 테스트에서는 실제 외부 접속을 하지 않는다. 확인하는 테스트(MemeThumbnailServiceTest)만 켜고 접속은 mock으로 바꾼다.
trendizm.thumbnail.fetch-enabled=false

# Gemini AI 요약: 테스트는 키 없이 돈다(요약 기능 꺼짐). 내 환경 변수에 GEMINI_API_KEY가 있어도 실제로 호출하지 않게 비워 둔다.
# 요약 흐름은 MemeSummaryServiceTest가 생성기를 mock으로 바꿔 확인한다.
trendizm.gemini.api-key=

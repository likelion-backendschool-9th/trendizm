# 로컬 개발용 설정 예시. 이 파일을 복사해 같은 폴더에 application.yml을 만든다 (application.yml은 커밋하지 않는다).
#   backend/src/main/resources 에서: cp application-example.yml application.yml   (Windows: copy application-example.yml application.yml)
# 비밀값은 여기 쓰지 않고 루트 .env에서 읽는다. 루트에서 docker compose up -d로 PostgreSQL·Redis를 먼저 띄운다.
spring:
  config:
    # 루트 .env를 설정값으로 읽는다. 실행 위치가 backend/(gradlew bootRun)이든 루트(IDE)이든 찾을 수 있게 둘 다 적는다
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:trendizm}
    username: ${DB_USERNAME:trendizm}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 로컬은 엔티티 기준으로 테이블을 만들고 고친다. 배포는 Flyway로 관리할 예정
      ddl-auto: update
    open-in-view: false
    # data.sql을 테이블이 만들어진 뒤에 실행한다
    defer-datasource-initialization: true
  sql:
    init:
      # src/main/resources/data.sql(화면 확인용 데이터)을 켤 때마다 실행한다.
      # 다시 켜도 중복되지 않게 data.sql의 INSERT에는 ON CONFLICT DO NOTHING을 붙인다
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

trendizm:
  jwt:
    # 3.3 로그인부터 필수. 32자 이상
    secret: ${JWT_SECRET:}

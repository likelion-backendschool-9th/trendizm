# 로컬 개발 전용 설정 예시. 이 파일을 복사해 같은 폴더에 compose.override.yaml을 만든다.
#   cp compose.override.example.yaml compose.override.yaml   (Windows: copy compose.override.example.yaml compose.override.yaml)
# compose.override.yaml은 docker compose up 할 때 compose.yaml과 자동으로 합쳐지고, 커밋하지 않는다(각자 포트를 바꿔 쓸 수 있게).
# 포트는 내 컴퓨터(127.0.0.1)에만 열고, PostgreSQL은 로컬에 설치된 PostgreSQL(5432)과 겹치지 않게 기본 5433을 쓴다.
# 포트를 바꾸려면 .env의 DB_PORT, REDIS_PORT를 고친다.

services:
  postgres:
    container_name: trendizm-postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  redis:
    container_name: trendizm-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

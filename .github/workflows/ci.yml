# CI. 백엔드 테스트, 프론트 lint·운영 빌드를 돌려 깨진 코드를 머지 전에 잡는다.
# - 작업 브랜치에 push하면 돈다: PR을 올리기 전에 미리 확인한다(WIP push가 빨간색이어도 머지에는 영향 없음).
# - develop·main으로 가는 PR에서 돈다: 머지 기준은 이 PR 검사다.
# - develop·main push는 deploy.yml이 테스트하므로 여기서는 돌지 않는다.
#
# - pull_request는 PR 브랜치를 develop에 합친 결과로 검사한다. "내 브랜치에선 되는데 합치면 깨지는" 경우도 잡힌다.
# - 배포(deploy.yml, Dockerfile)와 같은 고정 이미지를 docker run으로 쓴다. CI 통과 = 배포 테스트 통과가 되게 하기 위해서다.
# - 쓰는 Action은 checkout 하나뿐이다(deploy.yml과 같은 커밋으로 고정). 새 Action은 AGENTS.md 의존성 규칙대로 승인받고 추가한다.
# - 시크릿을 쓰지 않고 읽기 권한만 준다. PR 코드가 레포에 쓰거나 비밀값을 읽지 못하게 한다.
# - job 이름(backend, frontend)은 브랜치 보호의 필수 검사 이름이다. 바꾸면 Settings → Branches의 필수 검사도 고친다.

name: CI

on:
  push:
    branches-ignore: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# 같은 PR에 커밋을 연달아 올리면 이전 검사는 취소하고 마지막 것만 돌린다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # 브랜치 삭제로 생긴 push는 받을 코드가 없으므로 건너뛴다
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # deploy.yml의 백엔드 테스트와 같은 이미지·명령. LANG은 한글 테스트 이름으로 리포트 파일을 만들 때 깨지지 않게 둔다
      - name: 백엔드 테스트
        run: |
          docker run --rm -v "$PWD/backend:/app" -w /app \
            -e JAVA_TOOL_OPTIONS=-XX:-UseBASE64Intrinsics \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            eclipse-temurin:21.0.13_9-jdk-alpine@sha256:82801f9dcdcbad5a05082aba8c86d1da5b72ccb498e71318b1f91b5a477887b3 \
            ./gradlew --no-daemon -Dorg.gradle.java.installations.auto-detect=false test

      # 실패하면 어떤 테스트가 왜 실패했는지 로그 끝과 실행 요약(Summary)에 모아 보여 준다
      - name: 실패한 테스트 목록
        if: failure()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          rows = []
          for path in sorted(glob.glob("backend/build/test-results/test/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      problem = case.find(tag)
                      if problem is not None:
                          # "expected: 3 / but was: 2"처럼 여러 줄인 메시지를 한 줄로 모은다
                          reason = " ".join((problem.get("message") or problem.text or "").split())[:300]
                          rows.append((case.get("classname", "").rsplit(".", 1)[-1], case.get("name", ""), reason))
          if rows:
              print("### 실패한 테스트 %d개" % len(rows))
              print()
              print("| 클래스 | 테스트 | 원인 |")
              print("| --- | --- | --- |")
              for cls, name, reason in rows:
                  print("| %s | %s | %s |" % (cls, name, reason.replace("|", "\\|")))
          else:
              print("테스트 결과 파일에 실패한 테스트가 없습니다. 컴파일 오류 등은 위의 '백엔드 테스트' 로그를 확인하세요.")
          PY

  frontend:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # frontend/Dockerfile과 같은 Node 이미지
      NODE_IMAGE: node:22.23.5-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 설치 스크립트는 실행하지 않는다 (공급망 공격 대비, Dockerfile과 같음)
      - name: 의존성 설치
        run: docker run --rm -v "$PWD/frontend:/app" -w /app "$NODE_IMAGE" npm ci --ignore-scripts

      # 경고도 실패로 친다(package.json의 lint가 --max-warnings=0). 로컬 npm run lint와 같은 기준이다
      - name: lint
        run: docker run --rm -v "$PWD/frontend:/app" -w /app "$NODE_IMAGE" npm run lint

      # next build가 타입 검사도 한다. tsc --noEmit만 따로 돌리면 next가 만드는 타입(PageProps 등)이 없어 실패한다
      - name: 운영 빌드
        run: docker run --rm -v "$PWD/frontend:/app" -w /app -e NEXT_TELEMETRY_DISABLED=1 "$NODE_IMAGE" npm run build

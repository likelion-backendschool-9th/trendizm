# 공통 설정: 로컬과 배포에서 똑같이 쓰는 것만 둔다.
# 로컬 전용 설정(포트, 컨테이너 이름)은 compose.override.yaml에 있다.
# 값은 .env에서 읽는다. 처음이면 .env.example을 복사해 .env를 만든다.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME을 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?.env에 DB_USERNAME을 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:

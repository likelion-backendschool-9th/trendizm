# 로컬 개발용 PostgreSQL + Redis
# 실행: docker compose up -d   /  중지: docker compose down   /  데이터까지 삭제: docker compose down -v
# PostgreSQL은 로컬에 이미 설치된 PostgreSQL(5432)과 겹치지 않게 5433으로 연다.
# 운영 배포용 설정(compose.prod.yaml)과는 별개다. 여기 값은 로컬 전용이라 비밀값이 아니다.
name: trendizm-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: trendizm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-trendizm}
      POSTGRES_USER: ${DB_USERNAME:-trendizm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trendizm}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: trendizm-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
